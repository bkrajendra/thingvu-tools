[workspace]
resolver = "2"
members = ["crates/kicad-ai-mcp", "crates/kicad-ai-plugin", "crates/kicad-cli-runner", "crates/kicad-domain", "crates/kicad-ipc", "crates/kicad-ipc-mock", "crates/kicad-session", "crates/kicad-sexpr", "crates/kicad-fault-tests", "crates/mech-model"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/bkrajendra/thingsvu-tools"
rust-version = "1.99"

[workspace.dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost-types = "0.13"
prost-build = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
tracing = "0.1"
